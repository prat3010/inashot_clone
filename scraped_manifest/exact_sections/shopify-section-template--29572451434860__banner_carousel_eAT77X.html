<style>
  .banner-carousel { position: relative; width: 100%; overflow: hidden; background: #000; }
  .banner-carousel__track { position: relative; width: 100%; height: 100vh; }
  .banner-carousel__slide { position: absolute; inset: 0; transform: translateX(100%); transition: transform 800ms cubic-bezier(0.4,0,0.2,1); }
  .banner-carousel__slide.is-active { transform: translateX(0); }
  .banner-carousel__slide picture { display: block; width: 100%; height: 100%; }
  .banner-carousel__slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .banner-carousel__cta { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); padding: 16px 40px; background: #000; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; border-radius: 999px; z-index: 4; transition: transform 200ms, background 200ms; white-space: nowrap; }
  .banner-carousel__cta:hover { transform: translateX(-50%) translateY(-2px); background: #222; }
  .banner-carousel__arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(255,255,255,0.85); color: #000; cursor: pointer; display: grid; place-items: center; z-index: 5; }
  .banner-carousel__arrow:hover { background: #fff; }
  .banner-carousel__arrow--prev { left: 16px; }
  .banner-carousel__arrow--next { right: 16px; }
  @media (max-width: 600px) {
    .banner-carousel__arrow { width: 40px; height: 40px; }
    .banner-carousel__cta { padding: 14px 28px; font-size: 14px; bottom: 12%; }
  }

  body.is-scrolling-down.template-index .shopify-section-header { transform: translateY(-150%); }
</style>

<script>
(function () {
  document.querySelectorAll('[data-banner-carousel]').forEach(function (root) {
    var slides = Array.from(root.querySelectorAll('[data-slide]'));
    if (slides.length < 2) return;
    var prevBtn = root.querySelector('[data-prev]');
    var nextBtn = root.querySelector('[data-next]');
    var current = 0, timer = null, animating = false;
    var autoplay = root.getAttribute('data-autoplay') === 'true';
    var interval = parseInt(root.getAttribute('data-interval'), 10) || 5000;
    var paused = false;
    slides.forEach(function (s, i) { s.style.transform = i === 0 ? 'translateX(0)' : 'translateX(100%)'; });
    function go(direction) {
      if (animating) return;
      animating = true;
      var prev = current;
      var next = (current + direction + slides.length) % slides.length;
      if (prev === next) { animating = false; return; }
      var entry = direction > 0 ? '100%' : '-100%';
      var exit = direction > 0 ? '-100%' : '100%';
      slides[next].style.transition = 'none';
      slides[next].style.transform = 'translateX(' + entry + ')';
      void slides[next].offsetWidth;
      slides[next].style.transition = '';
      slides[next].style.transform = 'translateX(0)';
      slides[prev].style.transform = 'translateX(' + exit + ')';
      slides[prev].classList.remove('is-active');
      slides[next].classList.add('is-active');
      current = next;
      setTimeout(function () { animating = false; }, 820);
    }
    function start() { if (!autoplay || paused) return; stop(); timer = setInterval(function () { go(1); }, interval); }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function pauseIt() { paused = true; stop(); }
    if (prevBtn) prevBtn.addEventListener('click', function () { go(-1); pauseIt(); });
    if (nextBtn) nextBtn.addEventListener('click', function () { go(1); pauseIt(); });
    root.addEventListener('mouseenter', stop);
    root.addEventListener('mouseleave', start);
    start();
  });
})();
(function () {
  var lastY = window.scrollY, ticking = false;
  function update() {
    var y = window.scrollY;
    var d = y - lastY;
    if (Math.abs(d) > 5) {
      if (d > 0 && y > 100) document.body.classList.add('is-scrolling-down');
      else if (d < 0) document.body.classList.remove('is-scrolling-down');
      lastY = y;
    }
    ticking = false;
  }
  window.addEventListener('scroll', function () { if (!ticking) { requestAnimationFrame(update); ticking = true; } }, { passive: true });
})();
</script>
